:root[data-mode="dark"][data-accent="plum"]{--accent:#B9A1E6;--accent-2:#C8B5ED;--accent-soft:#2D2541;--accent-ink:#17112A}
:root[data-mode="dark"][data-accent="rose"]{--accent:#EE9CB8;--accent-2:#F3B1C7;--accent-soft:#3D2230;--accent-ink:#2A0F1A}
:root[data-mode="dark"][data-accent="amber"]{--accent:#E9B867;--accent-2:#F0C985;--accent-soft:#3A2D16;--accent-ink:#241805}
:root[data-mode="dark"][data-accent="slate"]{--accent:#A9B9CC;--accent-2:#BCC9D8;--accent-soft:#273241;--accent-ink:#111821}
:root[data-text="large"]{--fs:17px}

*{box-sizing:border-box}
:where(svg:not([width]):not(.chart)){width:1.15em;height:1.15em;flex:none}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.num,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:.86em} .tiny{font-size:.76em}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:248px;flex:none;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:19px}
.brand b{display:block;font-family:var(--serif);font-size:17px;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a.on svg{color:var(--accent)}
.nav .sep{height:1px;background:var(--line);margin:10px 10px}
.side .foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--muted)}
.side .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.main{flex:1;min-width:0}
.page{max-width:1120px;margin:0 auto;padding:26px 30px 120px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.1}
.top .eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}
.mhead{display:none}
.tabbar{display:none}
.fab{display:none}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-today{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px}
.card.flat{box-shadow:none}
.card.tint{background:var(--accent-soft);border-color:transparent}
.card h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card .ch .side-link{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;background:none;border:0;padding:0}
.help{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0;line-height:1}
.help:hover{color:var(--accent);border-color:var(--accent)}
.helptext{display:none;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink-2);margin:-2px 0 12px}
.helptext.on{display:block}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--accent-ink);border:0;padding:22px 22px 18px}
.hero h3{color:inherit;opacity:.85}
.hero .help{background:transparent;border-color:currentColor;color:inherit;opacity:.8}
.hero .big{font-family:var(--serif);font-size:58px;line-height:1;font-weight:600;letter-spacing:-.02em;margin:10px 0 6px}
.hero .big small{font-size:.5em;opacity:.8;margin-left:2px}
.hero .sub{opacity:.9;font-size:15px}
.hero .perday{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25)}
:root[data-mode="dark"] .hero .perday{border-top-color:rgba(0,0,0,.2)}
.hero .perday div b{display:block;font-size:18px;font-weight:600}
.hero .perday div span{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.hero .linkish{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
:root[data-mode="dark"] .hero .linkish{background:rgba(0,0,0,.14)}
.hero .ring{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.07)}
.hero.short{background:linear-gradient(160deg,#9A3F37,#B5544A)}
:root[data-mode="dark"] .hero.short{background:linear-gradient(160deg,#5A2621,#7A342D);color:#fff}
.breakdown{margin-top:14px;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;font-size:14px}
:root[data-mode="dark"] .breakdown{background:rgba(0,0,0,.14)}
.breakdown .l{display:flex;justify-content:space-between;padding:4px 0}
.breakdown .l.t{border-top:1px solid rgba(255,255,255,.35);margin-top:4px;padding-top:8px;font-weight:600}

.next{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--surface);border-radius:var(--r);padding:16px 18px}
:root[data-mode="dark"] .next{background:#EEF1F5;color:#141A21}
.next .n{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-weight:600;flex:none;opacity:.85}
.next .t{flex:1;min-width:0}
.next .t small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;font-weight:600}
.next .t b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25}
.next .t span{font-size:13.5px;opacity:.75}
.next .btn{background:rgba(255,255,255,.14);color:inherit;border-color:transparent}
:root[data-mode="dark"] .next .btn{background:rgba(0,0,0,.08)}

.kpi{display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi b{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
.kpi em{font-style:normal;font-size:13px;color:var(--muted)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:500;font-size:14px;line-height:1.1;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.lg{padding:13px 20px;font-size:16px;border-radius:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
label.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:15px;color:var(--ink);outline:none;min-height:42px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.money{font-family:var(--serif);font-size:20px;font-weight:600}
.in.xl{font-family:var(--serif);font-size:34px;font-weight:600;text-align:center;padding:14px}
.in.cell{min-height:34px;padding:6px 8px;font-size:14px;text-align:right;border-radius:8px;max-width:120px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip .d{width:9px;height:9px;border-radius:50%}
label.chip{cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500;box-shadow:0 0 0 1px var(--accent)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
.toggle input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:.2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:21px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2);letter-spacing:.02em;white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer;border-radius:10px;padding-left:8px;padding-right:8px;margin:0 -8px}
.li.click:hover{background:var(--surface-2)}
.li .dot{width:10px;height:10px;border-radius:50%;flex:none}
.li .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.li .main-t{flex:1;min-width:0}
.li .main-t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main-t>span{display:block;font-size:12.5px;color:var(--muted)}
.li .main-t .badge{margin-left:4px;vertical-align:2px}
.li .amt{font-weight:600;white-space:nowrap;text-align:right}
.li .amt span{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.dayhead{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:16px 2px 4px;border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:4px}

.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over i{background:var(--bad)}
.bar.thin{height:5px}
.catrow{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line-2);font-size:14px}
.catrow.h{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:4px}
.catrow .r{text-align:right}
.catrow .nm{display:flex;align-items:center;gap:9px;min-width:0}
.catrow .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .bar{grid-column:1/-1;margin-top:-2px}
.pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}

/* tiles (challenges) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.tile{aspect-ratio:1/1;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0;font-variant-numeric:tabular-nums}
.tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile small{display:block;font-size:9.5px;font-weight:500;opacity:.7}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cal .d{min-height:96px;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:6px 6px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .d .dn{font-size:12px;font-weight:600;color:var(--ink-2)}
.cal .ev{font-size:11px;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--sunk);color:var(--ink-2);font-weight:500}
.cal .ev.pay{background:var(--good-soft);color:var(--good)}
.cal .ev.paid{text-decoration:line-through;opacity:.6}
.cal .ev.due{background:var(--warn-soft);color:var(--warn)}
.cal .ev.debt{background:var(--accent-soft);color:var(--accent)}
.cal .ev.od{background:var(--bad-soft);color:var(--bad)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

/* goals */
.goal{display:flex;gap:16px;align-items:center}
.ringsvg{flex:none}
.ringsvg text{font-family:var(--sans);font-weight:600;fill:var(--ink)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(15,18,24,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.sheet{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:min(88vh,860px);overflow:auto;padding:22px 22px 20px;animation:pop .18s ease}
.sheet.wide{max-width:860px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.sheet .sh h2{font-family:var(--serif);font-size:23px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--surface);padding:12px 0 6px;z-index:2}
.sheet .foot .left{margin-right:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--shadow-lg);animation:pop .2s ease;max-width:90vw}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid rgba(168,103,15,.25);padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:14px}
.banner.acc{background:var(--accent-soft);border-color:transparent}
.banner b{font-weight:600}
.banner>svg{width:20px;height:20px;flex:none;color:var(--accent)}
.banner .grow{min-width:200px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl-wrap{overflow:auto;max-height:420px;border:1px solid var(--line-2);border-radius:12px}
.tbl tr.dim td{opacity:.45}
.tbl select.in{min-height:32px;padding:4px 6px;font-size:13px}

/* onboarding */
.welcome{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,var(--accent-soft),transparent 60%),var(--bg)}
.wcard{width:100%;max-width:560px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);padding:32px 30px}
.wcard h1{font-family:var(--serif);font-size:34px;line-height:1.12;margin:14px 0 10px}
.wcard p.lead{color:var(--ink-2);font-size:16px;margin:0 0 22px}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 16px;margin-bottom:10px}
.choice:hover{border-color:var(--accent);background:var(--surface-2)}
.choice .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.choice .ic svg{width:22px;height:22px}
.choice b{display:block;font-size:16px}
.choice span{font-size:13.5px;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:6px}
.steps i{height:4px;flex:1;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.trust{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.trust svg{width:15px;height:15px;color:var(--good)}
.billrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 80px 34px;gap:8px;margin-bottom:8px;align-items:center}

/* print */
#print{display:none}
@media print{
  body{background:#fff}
  .app,.scrim,.toast,.welcome{display:none!important}
  #print{display:block;color:#111;font-family:var(--sans);font-size:11pt}

function monthOpts(y) { return `<select class="in" style="width:auto;min-height:38px" data-change="month" aria-label="Month"><option value="all">All of ${y}</option>${[...Array(12).keys()].map(i => { const ym = y + '-' + pad(i + 1); return `<option value="${ym}" ${UI.month === ym ? 'selected' : ''}>${esc(D.my(ym))}</option>`; }).join('')}</select>`; }
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return v; }
function barsChart(rows, opt = {}) {
  const W = 640, H = opt.h || 210, pl = 46, pb = 26, pt = 10, n = rows.length;
  const max = Math.max(1, ...rows.map(r => Math.max(r.a || 0, r.b || 0))), nice = niceMax(max), gw = (W - pl - 8) / n, bw = Math.min(16, gw / 2.8);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Chart')}">`;
  for (let i = 0; i <= 4; i++) { const y = pt + (H - pt - pb) * (1 - i / 4); s += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${esc(opt.fmt ? opt.fmt(nice * i / 4) : M.w(nice * i / 4))}</text>`; }
  rows.forEach((r, i) => { const x = pl + gw * i + gw / 2, h = v => (H - pt - pb) * ((v || 0) / nice);
    s += `<rect x="${x - bw - 1}" y="${H - pb - h(r.a)}" width="${bw}" height="${h(r.a)}" rx="3" fill="var(--accent)"/>`;
    if (r.b != null) s += `<rect x="${x + 1}" y="${H - pb - h(r.b)}" width="${bw}" height="${h(r.b)}" rx="3" fill="var(--warn)" opacity=".75"/>`;
    s += `<text x="${x}" y="${H - 8}" text-anchor="middle">${esc(r.label)}</text>`; });
  return s + '</svg>';
}

/* ---------- shell ---------- */
function shell(content) {
  const nav = ROUTES.map(r => (r[0] === 'settings' ? '<div class="sep"></div>' : '') + `<a href="#${r[0]}" class="${UI.route === r[0] ? 'on' : ''}">${ic(r[2])}${r[1]}</a>`).join('');
  const tabs = [['today', 'Today', 'today'], ['income', 'Income', 'coin'], ['expenses', 'Expenses', 'receipt'], ['mileage', 'Miles', 'car']].map(r => `<a href="#${r[0]}" class="${UI.route === r[0] ? 'on' : ''}">${ic(r[2])}${r[1]}</a>`).join('') + `<a href="#more" class="${['taxes', 'yearend', 'settings', 'more'].includes(UI.route) ? 'on' : ''}">${ic('more')}More</a>`;
  const title = esc(S.profile.business || 'My Business');
  return `<div class="app"><aside class="side"><div class="brand"><div class="logo">S</div><div><b>${title}</b><span>Seekar Tax App</span></div></div>
  <div style="padding:0 8px 14px">${yearSel()}</div><nav class="nav">${nav}</nav>
  <div class="foot"><div><span class="dot"></span>Saved on this device</div><div style="margin-top:4px">${APP.demo ? 'Free demo' : 'v' + APP.version} · US federal ${UI.year}</div></div></aside>

  <div class="page">${banners()}${content}</div></main>

function banners() {
  let h = '';

/* ---------- TODAY ---------- */
function vToday() {
  const y = UI.year, e = estimate(y), yt = e.pj.yt, t = D.today(), name = S.profile.name;
  const hour = new Date().getHours(), greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  let h = pageTop(esc(D.long(t)) + ' · tax year ' + y, greet + (name ? ', ' + esc(name) : ''), `<button class="btn hide-m" data-act="addIncome">${ic('coin')}Income</button><button class="btn hide-m" data-act="addExpense">${ic('receipt')}Expense</button><button class="btn pri hide-m" data-act="addTrip">${ic('car')}Trip</button>`);
  const sofar = e.sofar, nx = e.next;
  const hero = `<section class="card hero"><div class="ring"></div><h3>Set aside for taxes · ${y} so far ${helpBtn('setaside')}</h3>${UI.help.setaside ? `<div class="breakdown" style="margin-top:10px">${esc(HELP.setaside)}</div>` : ''}
    <div class="big num">${esc(M.w(Math.max(0, sofar.all)))}</div>
    <div class="sub">on ${esc(M.w(yt.gross))} earned · put aside <b>${esc(pct(e.bt.setAside))}</b> of every payment</div>
    <div class="perday"><div><b class="num">${nx ? esc(D.dm(nx.due)) : '—'}</b><span>next payment</span></div><div><b class="num">${nx ? esc(M.w(nx.left)) : esc(M.w(0))}</b><span>due then</span></div><div><b class="num">${esc(M.w(e.paid))}</b><span>paid ${y}</span></div><div><b class="num">${esc(M.w(Math.max(0, e.bt.all)))}</b><span>${e.pj.basis === 'actual' ? 'full year' : 'projected year'}</span></div></div>
    <div class="row wrap" style="margin-top:12px"><button class="linkish" data-act="toggleBreak">${UI.breakdown ? 'Hide' : 'How is this worked out?'}</button><button class="linkish" data-act="addPayment">Record a payment</button></div>
    ${UI.breakdown ? `<div class="breakdown"><div class="l"><span>Business income</span><b>${esc(M.f(yt.gross))}</b></div><div class="l"><span>− Deductions (expenses, miles, home office)</span><span>${esc(M.f(yt.deductions))}</span></div><div class="l"><span>= Net profit</span><b>${esc(M.f(sofar.w.net))}</b></div><div class="l"><span>Self-employment tax</span><span>${esc(M.f(sofar.w.seTax + sofar.w.addl))}</span></div><div class="l"><span>Extra federal income tax</span><span>${esc(M.f(sofar.fed - sofar.w.seTax - sofar.w.addl))}</span></div><div class="l"><span>State estimate (${S.profile.stateRate || 0}%)</span><span>${esc(M.f(sofar.state))}</span></div><div class="l t"><span>Set aside</span><span>${esc(M.f(Math.max(0, sofar.all)))}</span></div></div>` : ''}</section>`;
  const ns = nextStep(e, yt);
  const next = `<div class="next"><div class="n">1</div><div class="t"><small>Right now · one thing only</small><b>${esc(ns.t)}</b>${ns.s ? `<span>${esc(ns.s)}</span>` : ''}</div>${ns.act ? `<button class="btn" data-act="${ns.act}" ${ns.data || ''}>${esc(ns.btn || 'Do it')}</button>` : ''}</div>`;
  h += `<div class="grid g-today"><div class="stack">${hero}${next}${quickCard()}${card('Year to date', `<div class="grid g4" style="gap:10px;margin-bottom:12px"><div class="kpi"><span>Income</span><b class="num">${esc(M.w(yt.gross))}</b></div><div class="kpi"><span>Deductions</span><b class="num">${esc(M.w(yt.deductions))}</b></div><div class="kpi"><span>Net profit</span><b class="num">${esc(M.w(yt.net))}</b></div><div class="kpi"><span>Miles</span><b class="num">${esc(Math.round(yt.miles).toLocaleString('en-US'))}</b></div></div><div class="legend" style="margin-bottom:6px"><span><i style="background:var(--accent)"></i>Income</span><span><i style="background:var(--warn);opacity:.75"></i>Deductions</span></div>${barsChart(monthly(y).map(r => ({ label: D.mon(r.ym), a: r.inc, b: r.exp })), { label: 'Income and deductions by month' })}`)}</div>`;
  h += `<div class="stack">${card('Tax calendar ' + y, calendarList(e), { help: 'quarterly', right: `<a class="side-link" href="#taxes">Estimator</a>` })}${topDeductions(yt)}${formsMini(y)}</div></div>`;
  return h;
}
function calendarList(e) {
  return `<div class="list">${e.qs.map(q => { const st = q.paidBy >= q.cumDue && q.cumDue > 0 ? ['good', 'Paid'] : q.past ? (q.left > 0 ? ['bad', 'Short ' + M.w(q.left)] : ['good', 'Done']) : ['warn', D.rel(q.due)];
    return `<div class="li"><span class="av" style="background:var(--accent-soft);color:var(--accent)">Q${q.q}</span><div class="main-t"><b>${esc(D.f(q.due, { month: 'short', day: 'numeric', year: 'numeric' }))}</b><span>${esc(M.f(q.amount))} installment</span></div><span class="badge ${st[0]}">${esc(st[1])}</span></div>`; }).join('')}</div>${T(e.y).dueNote ? `<p class="tiny muted" style="margin:8px 0 0">${esc(T(e.y).dueNote)}</p>` : ''}${T(e.y).fileBy ? `<p class="tiny muted" style="margin:6px 0 0">File your ${e.y} return by ${esc(D.f(T(e.y).fileBy, { month: 'long', day: 'numeric', year: 'numeric' }))}.</p>` : ''}`;
}
function topDeductions(yt) {
  const rows = Object.entries(yt.byCat).map(([k, v]) => ({ c: cat(k), v: k === 'car' && yt.carExcluded ? 0 : v })).filter(x => x.v > 0);
  if (yt.mileDed) rows.push({ c: { name: 'Business miles', color: '#C2410C' }, v: yt.mileDed });
  if (yt.home) rows.push({ c: { name: 'Home office', color: '#3B7DD8' }, v: yt.home });
  rows.sort((a, b) => b.v - a.v); const mx = rows.length ? rows[0].v : 1;
  return card('Top deductions', rows.slice(0, 6).map(x => `<div style="margin:8px 0"><div class="row between small" style="margin-bottom:4px"><span class="row" style="gap:8px">${dot(x.c.color)}${esc(x.c.name)}</span><b>${esc(M.f(x.v))}</b></div><div class="bar thin"><i style="width:${(x.v / mx * 100).toFixed(1)}%;background:${esc(x.c.color)}"></i></div></div>`).join('') || '<p class="muted small">Log expenses and trips to see your biggest write-offs.</p>', { right: `<a class="side-link" href="#yearend">Schedule C</a>` });
}
function formsMini(y) {
  const ps = payerSummary(y).filter(p => p.expect).slice(0, 5);
  if (!ps.length) return '';
  return card('1099s to expect', `<div class="list">${ps.map(p => `<div class="li">${av(p.payer, '#2F6F55')}<div class="main-t"><b>${esc(p.payer)}</b><span>${esc(p.form)} · you logged ${esc(M.f(p.amount))}</span></div>${p.rec && p.rec.received ? '<span class="badge good">Received</span>' : '<span class="badge warn">Waiting</span>'}</div>`).join('')}</div>`, { help: 'forms', right: `<a class="side-link" href="#income">All</a>` });
}
function quickCard() {
  const q = UI.quick;
  const freq = {}; for (const x of S.expenses.slice(-80)) freq[x.catId] = (freq[x.catId] || 0) + 1;
  let qc = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 6);
  for (const c of ['software', 'supplies', 'meals', 'parking', 'phone', 'office']) if (qc.length < 6 && !qc.includes(c)) qc.push(c);
  if (!UI.qcat || !qc.includes(UI.qcat)) UI.qcat = qc[0];
  const seg = `<div class="seg" style="margin-bottom:10px">${[['income', 'Income'], ['expense', 'Expense'], ['trip', 'Trip']].map(s => `<button type="button" class="${q === s[0] ? 'on' : ''}" data-act="quickMode" data-v="${s[0]}">${s[1]}</button>`).join('')}</div>`;
  let body = '';
  if (q === 'trip') body = `<form data-form="quickTrip" class="stack" style="gap:10px" autocomplete="off"><div class="row"><input class="in money grow" name="miles" inputmode="decimal" placeholder="0 miles" aria-label="Miles"><input class="in grow" name="purpose" placeholder="Purpose (e.g. client visit)" aria-label="Purpose"></div>${S.quick.length ? `<div class="chips">${S.quick.map(x => `<button type="button" class="chip" data-act="logQuickTrip" data-id="${x.id}">${ic('car')}${esc(x.name)} · ${esc(String(x.miles))} mi</button>`).join('')}</div>` : ''}<button class="btn pri">Log trip</button></form>`;
  else if (q === 'expense') body = `<form data-form="quickExp" class="stack" style="gap:10px" autocomplete="off"><div class="row"><input class="in money grow" name="amount" inputmode="decimal" placeholder="$0.00" aria-label="Amount"><input class="in grow" name="vendor" placeholder="Where? (vendor)" aria-label="Vendor"></div><div class="chips">${qc.map(id => { const c = cat(id); return `<button type="button" class="chip ${UI.qcat === id ? 'on' : ''}" data-act="qcat" data-id="${id}"><span class="d" style="background:${esc(c.color)}"></span>${esc(c.name.replace(/ \(.*\)/, ''))}</button>`; }).join('')}</div><div class="row"><button class="btn pri grow">Log expense</button><button type="button" class="btn" data-act="addExpense">${ic('camera')}With receipt</button></div></form>`;
  else body = `<form data-form="quickInc" class="stack" style="gap:10px" autocomplete="off"><div class="row"><input class="in money grow" name="amount" inputmode="decimal" placeholder="$0.00" aria-label="Amount"><input class="in grow" name="payer" placeholder="Who paid you?" aria-label="Payer" list="payers"></div><datalist id="payers">${[...new Set(S.income.map(x => x.payer).filter(Boolean))].slice(0, 30).map(p => `<option value="${esc(p)}">`).join('')}</datalist><button class="btn pri">Log income</button></form>`;

}
function nextStep(e, yt) {
  const t = D.today(), y = UI.year;
  if (!S.meta.taxSet) return { t: 'Add your tax details', s: 'Filing status, any W-2 job, last year\'s tax. Two minutes, and the estimate gets accurate.', act: 'taxDetails', btn: 'Add details' };
  if (e.next && D.diff(t, e.next.due) <= 21) return { t: `Pay ${M.w(e.next.left)} estimated tax by ${D.dm(e.next.due)}`, s: 'Pay at IRS.gov/payments (Direct Pay), then record it here.', act: 'addPayment', btn: 'Record it' };
  if (yt.missingReceipts >= 3) return { t: `${yt.missingReceipts} expenses over $75 have no receipt`, s: 'Snap them now while you still have them.', act: 'goMissing', btn: 'Show them' };
  if (+t.slice(5, 7) <= 3 && y === +t.slice(0, 4) - 1) return { t: 'Tax season: print your packet', s: 'Schedule C totals, miles, 1099s and payments in one PDF for you or your preparer.', act: 'printPacket', btn: 'Print' };
  const last = [...S.income, ...S.expenses, ...S.trips].reduce((m, x) => x.date > m ? x.date : m, '');
  if (!last || D.diff(last, t) >= 7) return { t: 'Log this week\'s income, costs and miles', s: 'Five minutes a week keeps tax season painless.', act: 'quickSheet', btn: 'Add' };
  const unset = S.income.filter(x => inYear(x.date, y) && !x.setAside).length;
  if (unset >= 3) return { t: `Move ${pct(e.bt.setAside)} of ${unset} payments to savings`, s: 'Tap “Set aside” on the Income page once you\'ve moved it.', act: 'goIncome', btn: 'Open' };
  if (S.expenses.length > 20 && (!S.meta.lastBackup || D.diff(S.meta.lastBackup, t) > 30) && !APP.demo) return { t: 'Download a backup', s: 'Your records live only on this device.', act: 'backup', btn: 'Back up' };
  return { t: 'You\'re on top of it', s: 'Nothing needs you right now.', act: '', btn: '' };
}

/* ---------- INCOME ---------- */
function vIncome() {
  const y = UI.year, e = estimate(y);

  h += `<div class="grid g4" style="margin-bottom:16px">${kpi('Income ' + y, esc(M.w(sum(all, x => x.amount))), new Set(all.map(x => x.payer)).size + ' payers')}${kpi('Tips', esc(M.w(sum(all.filter(x => x.type === 'tips'), x => x.amount))), S.profile.tipsEligible ? 'tips deduction on' : 'see Settings')}${kpi('Set aside', esc(pct(e.bt.setAside)), 'of every payment')}${kpi('Moved to savings', esc(M.w(e.setAsideTotal)), all.filter(x => x.setAside).length + ' of ' + all.length + ' payments')}</div>`;

  h += `<div class="grid g-today"><div class="stack">${card('', `<div class="row" style="margin-bottom:8px"><input class="in" placeholder="Search payers" data-change="q" value="${esc(UI.q)}" aria-label="Search"></div>${rows ? `<div class="list">${rows}</div>` : empty('No income yet', 'Log payments as they arrive, or import a CSV from your bank.', `<button class="btn pri sm" data-act="addIncome">Add income</button>`)}`)}</div>`;
  const ps = payerSummary(y);
  h += `<div class="stack">${card('1099 forms check', ps.length ? `<table class="tbl"><thead><tr><th>Payer</th><th class="r">You logged</th><th>Form</th><th></th></tr></thead><tbody>${ps.map(p => { const diff = p.rec && p.rec.amount ? p.rec.amount - p.amount : 0; return `<tr><td>${esc(p.payer)}${diff ? `<div class="tiny ${Math.abs(diff) > 100 ? 'bad' : 'muted'}">Form says ${esc(M.f(p.rec.amount))} (${diff > 0 ? '+' : '−'}${esc(M.f(Math.abs(diff)))})</div>` : ''}</td><td class="r num">${esc(M.f(p.amount))}</td><td class="small">${p.form ? esc(p.form) + (p.expect ? '' : '<div class="tiny muted">under threshold</div>') : '<span class="muted">none</span>'}</td><td><button class="btn sm ${p.rec && p.rec.received ? 'ghost' : 'soft'}" data-act="formRec" data-p="${esc(p.payer)}">${p.rec && p.rec.received ? 'Received' : 'Got it?'}</button></td></tr>`; }).join('')}</tbody></table>` : '<p class="muted small">Payers appear here as you log income.</p>', { help: 'forms' })}</div></div>`;
  return h;

/* ---------- EXPENSES ---------- */
function vExpenses() {

  list.sort((a, b) => a.date < b.date ? 1 : -1);
  let h = pageTop('Write-offs · ' + y, 'Expenses', `${monthOpts(y)}<button class="btn" data-act="import">${ic('upload')}<span class="hide-m">Import CSV</span></button><button class="btn pri" data-act="addExpense">${ic('plus')}<span class="hide-m">Add expense</span></button>`);
  h += `<div class="grid g4" style="margin-bottom:16px">${kpi('Deductible ' + y, esc(M.w(yt.expDed)), yt.exp.length + ' expenses')}${kpi('Missing receipts', String(yt.missingReceipts), 'purchases of $75+', yt.missingReceipts ? 'warn' : 'good')}${kpi('Home office', esc(M.w(yt.home)), S.profile.homeMethod === 'none' ? 'not set up' : S.profile.homeMethod + ' method')}${kpi('Biggest category', (() => { const top = Object.entries(yt.byCat).filter(([k]) => !(k === 'car' && yt.carExcluded)).sort((a, b) => b[1] - a[1])[0]; return top ? esc(cat(top[0]).name.replace(/ \(.*\)/, '')) : '—'; })(), '')}</div>`;

/* ---------- receipts in IndexedDB (photos stay on the device) ---------- */
const RX = {
  db: null, cache: {},
  open() { return new Promise((res, rej) => { if (RX.db) return res(RX.db); if (!window.indexedDB) return rej('no idb'); const r = indexedDB.open(APP.key + '-receipts', 1); r.onupgradeneeded = () => r.result.createObjectStore('r'); r.onsuccess = () => { RX.db = r.result; res(RX.db); }; r.onerror = () => rej(r.error); }); },
  tx(mode, fn) { return RX.open().then(db => new Promise((res, rej) => { const t = db.transaction('r', mode), st = t.objectStore('r'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); })); },
  put(id, data) { RX.cache[id] = data; return RX.tx('readwrite', st => st.put(data, id)).catch(() => { }); },
  get(id) { if (RX.cache[id]) return Promise.resolve(RX.cache[id]); return RX.tx('readonly', st => st.get(id)).then(v => { if (v) RX.cache[id] = v; return v; }).catch(() => null); },
  del(id) { delete RX.cache[id]; return RX.tx('readwrite', st => st.delete(id)).catch(() => { }); },
  all() { return RX.open().then(db => new Promise(res => { const out = {}; const t = db.transaction('r', 'readonly'); const c = t.objectStore('r').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } else res(out); }; c.onerror = () => res(out); })).catch(() => ({})); },
  clear() { RX.cache = {}; return RX.tx('readwrite', st => st.clear()).catch(() => { }); }
};
function compressImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const max = 1400, s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', 0.72)); }; img.onerror = () => rej('not an image'); img.src = fr.result; };
    fr.onerror = () => rej('read error'); fr.readAsDataURL(file);
  });
}
function hydrateReceipts() { document.querySelectorAll('img[data-rid]').forEach(el => { const id = el.dataset.rid; RX.get(id).then(d => { if (d) el.src = d; }); }); }

  pr.innerHTML = `<h1>${esc(p.business || 'My Business')} · ${y} tax packet</h1><p>${esc(p.name || '')} · Filing status: ${esc(STATUS.find(s => s[0] === p.status)[1])} · Prepared ${esc(D.long(D.today()))}</p>
   <div class="kp"><div>Gross receipts<b>${esc(M.f(yt.gross))}</b></div><div>Expenses<b>${esc(M.f(yt.expDed + yt.mileDed))}</b></div><div>Home office<b>${esc(M.f(yt.home))}</b></div><div>Net profit<b>${esc(M.f(yt.net))}</b></div></div>
   <h2>Schedule C expenses</h2><table><tr><th>Line</th><th>Category</th><th class="r">Amount</th></tr>${lines.map(([c, v]) => `<tr><td>${c.line}</td><td>${esc(c.name)}</td><td class="r">${esc(M.f(v))}</td></tr>`).join('')}${yt.mileDed ? `<tr><td>9</td><td>Standard mileage: ${Math.round(yt.miles).toLocaleString('en-US')} business miles × ${mileRate(y)}¢</td><td class="r">${esc(M.f(yt.mileDed))}</td></tr>` : ''}</table>
   ${yt.carExcluded ? `<p>Actual car costs of ${esc(M.f(yt.carActual))} were recorded but not deducted (standard mileage method).</p>` : ''}
   <h2>Income by payer and 1099 forms</h2><table><tr><th>Payer</th><th>Form</th><th class="r">Logged</th><th class="r">On form</th></tr>${payerSummary(y).map(x => `<tr><td>${esc(x.payer)}</td><td>${esc(x.form || '—')}${x.rec && x.rec.received ? ' (received)' : ''}</td><td class="r">${esc(M.f(x.amount))}</td><td class="r">${x.rec && x.rec.amount ? esc(M.f(x.rec.amount)) : ''}</td></tr>`).join('')}</table>
   <h2>Estimated tax payments</h2><table><tr><th>Date</th><th>Quarter</th><th>To</th><th class="r">Amount</th></tr>${S.payments.filter(x => x.year === y).map(x => `<tr><td>${esc(x.date)}</td><td>Q${x.q}</td><td>${x.kind === 'state' ? 'State' : 'IRS'}</td><td class="r">${esc(M.f(x.amount))}</td></tr>`).join('')}</table>
   <h2>Mileage log</h2><table><tr><th>Date</th><th>Purpose</th><th>From / to</th><th class="r">Miles</th></tr>${yt.trips.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(t => `<tr><td>${esc(t.date)}</td><td>${esc(t.purpose)}</td><td>${esc((t.from || '') + (t.to ? ' to ' + t.to : ''))}</td><td class="r">${t.miles}</td></tr>`).join('')}<tr><td colspan="3"><b>Total business miles</b></td><td class="r"><b>${Math.round(yt.miles * 10) / 10}</b></td></tr></table>
   <h2>Other details for your preparer</h2><table><tr><td>Self-employed health insurance</td><td class="r">${esc(M.f(p.health))}</td></tr><tr><td>SEP / Solo 401(k) contributions</td><td class="r">${esc(M.f(p.retire))}</td></tr><tr><td>Qualified tips received</td><td class="r">${esc(M.f(yt.tips))}</td></tr><tr><td>Estimated business tax (this app)</td><td class="r">${esc(M.f(Math.max(0, e.bt.all)))}</td></tr></table>
   <p style="color:#777;margin-top:18pt">Prepared with the Seekar Tax App from the owner's records. Estimates only; not tax advice.</p>`;
  window.print();
}

/* ---------- init ---------- */
function init() {
  S = Store.load();
  const boot = () => {
    const t = D.today(); S.meta.lastOpen = t; save();
    document.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (!fn) return; if (el.tagName === 'A' || el.tagName === 'BUTTON' || el.tagName === 'IMG') ev.preventDefault(); fn(el.dataset, el, ev); });
    document.addEventListener('change', ev => { const el = ev.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el); });
    document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.change === 'ob') CHG.ob(el); });
    document.addEventListener('submit', ev => { const f = ev.target.closest('form[data-form]'); if (!f) return; ev.preventDefault(); const fn = FORM[f.dataset.form]; if (fn) fn(f, readForm(f)); });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });
    window.addEventListener('hashchange', route);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.meta.setup) render(); });
    if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.profile.mode === 'auto') applyTheme(); }); } catch (e) { }
    route();
    if (/^https?:/.test(location.protocol)) { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); }
  };
  if (!S) { S = blankState(); if (APP.demo) { sampleState().then(s => { S = s; S.meta.setup = true; boot(); }); return; } }
  boot();
}
document.addEventListener('DOMContentLoaded', init);

</script>
